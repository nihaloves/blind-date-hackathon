function advanceDay(state) {
  const nextDay=state.day+1, nextEta=Math.max(0,state.rescueEta-1);
  const ev=EMERGENCIES.find(e=>e.triggerDay===nextDay);
  let s=ev?ev.apply({...state,day:nextDay,rescueEta:nextEta}):{...state,day:nextDay,rescueEta:nextEta};
  const pDrain=s.conservationActive?4:8, sGen=s.solarArray==='OPTIMAL'?14:s.solarArray==='PARTIALLY FUNCTIONAL'?8:4;
  let nP=Math.max(0,Math.min(100,s.power+sGen-pDrain));
  const wCons=s.rationingActive?3:6, rOut=s.waterRecycling==='FUNCTIONAL'?5:s.waterRecycling==='DEGRADED'?2:0, eRec=nP<30?Math.floor(rOut/2):rOut;
  let nW=Math.max(0,Math.min(100,s.water+eRec-wCons));
  let nO=Math.max(0,Math.min(100,s.oxygen+(nP>20?6:2)-5-(s.oxygenLeak?8:0)));
  let nF=Math.max(0,Math.min(100,s.food-(s.rationingActive?3:5)));
  let nPr=s.pressureLeak?Math.max(0,s.habitatPressure-8):s.habitatPressure;
  let hD=0;
  if(nW<25)hD-=8; if(nO<25)hD-=12; if(nF<20)hD-=5; if(nPr<40)hD-=10; if(s.rationingActive&&nextDay%2===0)hD-=2;
  let nH=Math.max(0,Math.min(100,s.crewHealth+hD));
  const uCrew=s.crew.map(c=>{const mh=Math.max(0,Math.min(100,c.health+hD));return{...c,health:mh,status:mh>75?'HEALTHY':mh>40?'FATIGUED':mh>15?'EXHAUSTED':'CRITICAL'};});
  let ms='STABLE';
  if(nW<=15||nO<=15||nF<=10||nPr<=20||nH<=15)ms='CRITICAL';
  else if(nW<=35||nO<=40||nF<=30||nH<=60||s.activeEmergencyId)ms='WARNING';
  const base={...s,water:nW,oxygen:nO,food:nF,power:nP,habitatPressure:nPr,crewHealth:nH,crew:uCrew};
  if(nextEta===0){
    return nH>20&&nO>10&&nW>10
      ?{...base,screen:'VICTORY',status:'RESCUED',logs:[{day:nextDay,title:'RESCUE SHIP ARRIVED',description:'All crew safely evacuated.',type:'SUCCESS'},...s.logs]}
      :{...base,screen:'DEFEAT',status:'FAILED',logs:[{day:nextDay,title:'RESCUE TOO LATE',description:'Life support collapsed before rescue.',type:'CRITICAL'},...s.logs]};
  }
  if(nO===0||nPr===0||nH===0||nW===0)return{...base,screen:'DEFEAT',status:'FAILED',logs:[{day:nextDay,title:'CATASTROPHIC FAILURE',description:'Life support depleted.',type:'CRITICAL'},...s.logs]};
  return{...base,status:ms,logs:[{day:nextDay,title:`MISSION DAY ${nextDay} LOG`,description:`Water:${nW}% O2:${nO}% Power:${nP}%`,type:'INFO'},...s.logs]};
}

function Bar({label,val,unit,ic,icColor}) {
  const isCrit=val<=20, isLow=val<=40&&val>20;
  const barColor=isCrit?'#ef4444':isLow?'#f59e0b':'#00f0ff';
  const statusText=isCrit?'CRITICAL':isLow?'LOW':'NORMAL';
  const statusColor=isCrit?'#f87171':isLow?'#fbbf24':'#34d399';
  return (
    <div className="resource-bar">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.375rem',fontFamily:'Space Mono,monospace',fontSize:'0.65rem'}}>

          <IC n={ic} s={14} c={icColor}/>{label}

        <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
          <span style={{color:statusColor,fontWeight:700}}>{statusText}</span>

  );
}

function RightPanel({state,onExecuteAction}) {
  const getRec=()=>{
    if(state.oxygenLeak&&state.spareParts>=1)return{priority:'CRITICAL OXYGEN PRIORITY',text:'Active hull leak bleeding oxygen. Seal immediately.',actionId:'repair_oxygen_leak'};
    if(state.water<40&&state.waterRecycling!=='FUNCTIONAL'&&state.spareParts>=1)return{priority:'WATER RECYCLING PRIORITY',text:'Water dropping and recycling degraded. Overhaul turbine.',actionId:'repair_recycling'};
    if(state.power<35&&state.solarArray!=='OPTIMAL'&&state.spareParts>=1)return{priority:'POWER CASCADE WARNING',text:'Low power reducing water recovery. Repair solar array.',actionId:'repair_solar'};
    if(state.water<35&&!state.rationingActive)return{priority:'RATIONING ADVISORY',text:'Reserves constrained. Enforce rationing to extend supplies.',actionId:'ration_supplies'};
    if(!state.conservationActive&&state.power<50)return{priority:'POWER CONSERVATION',text:'Enable power conservation to safeguard life support.',actionId:'conserve_power'};
    return{priority:'OPERATIONAL STABILITY',text:'All systems nominal. Monitor telemetry until rescue arrives.',actionId:null};
  };
  const rec=getRec();
  return (
    <div className="panel" style={{height:'100%'}}>
      <div className="panel-header"><span>MISSION INTELLIGENCE</span><span style={{color:'#94a3b8'}}>AI ADVISOR</span></div>

      <div style={{flex:1,overflowY:'auto'}}>

          return (
            <div className={`action-card${isRec?' recommended':''}`} key={action.id}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.25rem'}}>
                <div style={{fontFamily:'Space Mono,monospace',fontSize:'0.7rem',fontWeight:700,color:'#fff',display:'flex',alignItems:'center',gap:'0.375rem'}}>

                <div style={{display:'flex',gap:'0.375rem'}}>
                  {action.cost.spareParts&&<span style={{fontFamily:'Space Mono,monospace',fontSize:'0.6rem',color:'#fbbf24',background:'rgba(120,53,15,0.3)',border:'1px solid rgba(245,158,11,0.3)',padding:'0.125rem 0.5rem',borderRadius:'0.25rem'}}>COST: {action.cost.spareParts} PART</span>}

        </p>
        <div className="debrief-box">
          <div style={{fontSize:'0.65rem',color:'#00f0ff',display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.75rem'}}><IC n="award" s={13}/>MISSION SURVIVAL DEBRIEF</div>
          <div className="debrief-grid">
            {[{l:'DAYS SURVIVED',v:state.day,c:'#fff'},{l:'REPAIRS',v:state.stats.repairsCompleted,c:'#34d399'},{l:'EMERGENCIES',v:state.stats.emergenciesResolved,c:'#00f0ff'},{l:'SURVIVORS',v:`${state.crew.filter(c=>c.health>0).length}/4`,c:state.crewHealth>20?'#34d399':'#f87171'}].map(({l,v,c})=>(
              <div key={l}><div style={{color:'#475569',marginBottom:'0.25rem'}}>{l}</div><div style={{fontSize:'1.1rem',fontWeight:700,color:c}}>{v}</div></div>
            ))}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn-restart" onClick={onRestart}><IC n="rot" s={17}/>START NEW MISSION</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [state,setState]=useState(()=>{
    const saved=localStorage.getItem('moonloop_save');
    if(saved){try{return JSON.parse(saved);}catch(e){}}
    return INITIAL_STATE;
  });
  useEffect(()=>{
    if(state.screen==='PLAYING')localStorage.setItem('moonloop_save',JSON.stringify(state));
    else localStorage.removeItem('moonloop_save');
  },[state]);
  const handleStart=()=>setState({...INITIAL_STATE,screen:'PLAYING'});
  const handleRestart=()=>{localStorage.removeItem('moonloop_save');setState(INITIAL_STATE);};
  const handleAdvanceDay=()=>setState(prev=>advanceDay(prev));
  const handleAction=action=>setState(prev=>action.execute(prev));

  if(state.screen==='INTRO')return <IntroScreen onStart={handleStart}/>;
  if(state.screen==='VICTORY'||state.screen==='DEFEAT')return <GameOverScreen state={state} onRestart={handleRestart}/>;

  return (
    <div className="game-wrapper scanline">
      <div className="bg-ambient"/>
      <TopNav state={state} onRestart={handleRestart}/>
      <main className="game-main">
        <div style={{display:'flex',flexDirection:'column'}}><LeftPanel state={state}/></div>
        <div style={{display:'flex',flexDirection:'column'}}><CenterPanel state={state}/></div>
        <div style={{display:'flex',flexDirection:'column'}}><RightPanel state={state} onExecuteAction={handleAction}/></div>
      </main>
      <div className="game-bottom"><BottomPanel state={state} onAdvanceDay={handleAdvanceDay}/></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
